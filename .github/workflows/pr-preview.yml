name: Pull Request · Build and Visual Preview

on:
  push:
    branches: ['design/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Preview desktop and mobile
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/folio-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/capture-pr-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-design-preview
          path: preview-screenshots/
          if-no-files-found: warn
